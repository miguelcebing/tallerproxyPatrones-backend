server:
  port: ${PORT:8080}

spring:
  application:
    name: tallerproxy-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  simulation:
    payment-failure-rate: ${APP_PAYMENT_FAILURE_RATE:0.10}
    min-latency-ms: ${APP_MIN_LATENCY_MS:15}
    max-latency-ms: ${APP_MAX_LATENCY_MS:120}
    load-requests: 50
    load-threads: 8
  logging:
    capacity: 2000
    stack-trace-frames: 5
  metrics:
    degraded-error-rate-threshold: 15.0
  pagination:
    default-size: 20
    max-size: 100
